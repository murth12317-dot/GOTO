# Render の Blueprint（無料プラン）
services:
  - type: web
    name: tomodachi-mahjong
    runtime: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node server.js"
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SHEET_URL
        sync: false
      - key: SHEET_SECRET
        sync: false
